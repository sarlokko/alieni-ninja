name: Deploy online

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/gh-pages-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write build stamp
        run: echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> public/build.txt

      - name: Deploy public to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify gh-pages branch
        run: |
          sleep 8
          curl -fsSL "https://raw.githubusercontent.com/sarlokko/alieni-ninja/gh-pages/game.html" | grep -q "v=48"
          echo "gh-pages branch OK"
