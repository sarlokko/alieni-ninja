name: Deploy online

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - '.github/workflows/gh-pages-branch.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write build stamp
        run: echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/build.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site
        run: |
          echo "Waiting for CDN propagation..."
          for i in 1 2 3 4 5 6 8 10; do
            sleep $((i * 8))
            if curl -fsSL "https://sarlokko.github.io/alieni-ninja/game.html" | grep -q "v=44"; then
              echo "Live OK: github.io serves v44"
              exit 0
            fi
            echo "Attempt $i — not v44 yet..."
          done
          echo "WARNING: github.io not yet on v44 (CDN may lag a few minutes)"
          curl -fsSL "https://sarlokko.github.io/alieni-ninja/game.html" | head -30 || true
